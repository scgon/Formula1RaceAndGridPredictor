name: Refresh bundled season data

# Keeps data/*.csv (the bundled season CSVs the web app and CLIs reuse)
# current. This is what protects the hosted app from the F1 API rate limit
# (500 uncached calls/hour): a fresh container finds bundled data and only
# ever downloads newly completed rounds. Pushes that touch pipeline code are
# covered too, so a CSV schema change regenerates the bundle immediately.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (UTC; GitHub may delay peak-time crons)
  push:
    branches: [main]
    paths: ['pipelines/**', 'scripts/**', 'webapp/**', 'requirements.txt']
  workflow_dispatch:
    inputs:
      years:
        description: "Seasons to collect, space-separated (e.g. '2018 2019')"
        required: false
        default: ""
      wait-on-limit:
        description: "Sleep and retry when the F1 API rate limit is hit"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore fastf1 cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect season data
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.years }}" ]; then
            ARGS="$ARGS --years ${{ github.event.inputs.years }}"
          fi
          if [ "${{ github.event.inputs.wait-on-limit }}" = "true" ]; then
            ARGS="$ARGS --wait-on-limit"
          fi
          python scripts/refresh_data.py $ARGS
      # Save the fastf1 cache even when collection exits non-zero (some
      # rounds missing): the plain cache action skips its post step on job
      # failure, which would force every retry to re-download everything.
      - name: Save fastf1 cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: fastf1-${{ github.run_id }}
      # Commit even when collection exits non-zero: fetched rounds are
      # valuable progress and resume on the next run. A plain auto-commit
      # push gets rejected whenever main advanced during a long collection
      # run, silently losing that run's data — so rebase onto the latest
      # main first (keeping our freshly collected CSVs on data/ conflicts)
      # and retry the push.
      - name: Commit updated CSVs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to commit"
            exit 0
          fi
          git commit -m "Refresh bundled season data [skip ci]"
          if ! git pull --rebase origin main; then
            echo "rebase conflict — keeping our collected data files"
            git checkout --theirs -- data/ 2>/dev/null || true
            git add data/*.csv
            GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort
          fi
          git push origin main
